name: Release Creation

on:
 release:
    types: [published]

jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v2

         # Substitute the Manifest and Download Links for the Versioned ones in the module.json
         - name: Substitute Manifest and Download Links for Versioned ones
           id: sub_manifest_link_version
           uses: microsoft/variable-substitution@v1
           with:
            files: 'module.json'
           env:
            version: ${{github.event.release.tag_name}}
            url: https://github.com/${{github.repository}}
            manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
            download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zi

            # create a zip file w/ all the files needed by the module to add to the release
         - run: zip -r ./module.zip module.json README.md CHANGELOG.md LICENSE scripts/ languages/ templates/ stylea/ libs/

            # create a release for this specific version
         - name: Update Release with files
           id: create_version_release
           uses: ncipollo/release-action@v1
           with:
            allowUpdates: true # Set this to false if you want to prevent updating existing releases
            name: ${{ github.event.release.name }}
            draft: ${{ github.event.release.unpublished }}
            prerelease: ${{ github.event.release.prerelease }}
            token: ${{ secrets.GITHUB_TOKEN }}
            artifacts: './module.json, ./module.zip'
            tag: ${{ github.event.release.tag_name }}
            body: ${{ github.event.release.body }}